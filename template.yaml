AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  JalTaap - heat and waterlogging safety copilot for Delhi's outdoor workers.
  Whole backend as code: sam build && sam deploy (region ap-south-1).

Parameters:
  ModelId:
    Type: String
    Description: Bedrock chat model or inference profile id (tool use, low latency). Check with `aws bedrock list-inference-profiles --region ap-south-1`.
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  FallbackModelId:
    Type: String
    Description: Amazon Nova fallback model or inference profile id.
    Default: apac.amazon.nova-lite-v1:0
  VisionModelId:
    Type: String
    Description: Bedrock model for photo checks (image input). Defaults to ModelId when empty.
    Default: ""
  BedrockRegion:
    Type: String
    Default: ap-south-1
  StrandsLayerArn:
    Type: String
    Description: Official Strands Agents layer, arn:aws:lambda:ap-south-1:856699698935:layer:strands-agents-py3_12-x86_64:<version> (see the Strands deploy guide).
  WebOrigin:
    Type: String
    Description: The Amplify site origin, e.g. https://main.d123.amplifyapp.com (no trailing slash). Used for CORS and the map key referrer.
    Default: http://localhost:5173
  AlarmEmail:
    Type: String
    Description: Team email for CloudWatch alarms and AWS Budgets alerts. Leave empty to skip subscriptions.
    Default: ""
  OfficerEmailFrom:
    Type: String
    Description: SES-verified sender for officer alert emails. Leave empty to disable.
    Default: ""

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]            # must match the Strands layer architecture
    CodeUri: backend/
    Tracing: Active
    Timeout: 10
    MemorySize: 256
    Layers: [!Ref StrandsLayerArn, !Ref DepsLayer]
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: jaltaap
        POWERTOOLS_METRICS_NAMESPACE: JalTaap
        LOG_LEVEL: INFO
        MODEL_ID: !Ref ModelId
        FALLBACK_MODEL_ID: !Ref FallbackModelId
        VISION_MODEL_ID: !Ref VisionModelId
        BEDROCK_REGION: !Ref BedrockRegion
        IMD_ENABLED: "false"
        WEB_ORIGIN: !Ref WebOrigin
        SSM_PREFIX: /jaltaap
        OFFICER_EMAIL_FROM: !Ref OfficerEmailFrom
        USERS_TABLE: !Ref UsersTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        RISK_TABLE: !Ref RiskCacheTable
        REPORTS_TABLE: !Ref ReportsTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        BUCKET: !Sub jaltaap-${AWS::AccountId}-${AWS::Region}
        INBOUND_QUEUE_URL: !Ref InboundQueue
        ALERT_QUEUE_URL: !Ref AlertQueue

Resources:
  # ---------------------------------------------------------------- layer
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-deps
      Description: Powertools, httpx, pyyaml, python-ulid, Pillow (Linux wheels)
      ContentUri: layer/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata:
      BuildMethod: makefile

  # ---------------------------------------------------------------- HTTP API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref WebOrigin]
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  # ---------------------------------------------------------------- data
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true, SSEType: KMS}   # channel ids are KMS-encrypted at rest

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: user, AttributeType: S}
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      GlobalSecondaryIndexes:
        - IndexName: byUser
          KeySchema: [{AttributeName: user, KeyType: HASH}]
          Projection: {ProjectionType: ALL}

  RiskCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-risk
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: status, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
        - {AttributeName: geohash5, AttributeType: S}
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: byStatus
          KeySchema: [{AttributeName: status, KeyType: HASH}, {AttributeName: created_at, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}
        - IndexName: byArea
          KeySchema: [{AttributeName: geohash5, KeyType: HASH}, {AttributeName: created_at, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub jaltaap-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: raw-photos-30-days, Status: Enabled, Prefix: reports/raw/, ExpirationInDays: 30}
          - {Id: held-photos-1-day, Status: Enabled, Prefix: reports/hold/, ExpirationInDays: 1}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref WebOrigin]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["content-type"]
            MaxAge: 600

  # ---------------------------------------------------------------- queues
  InboundDLQ:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  InboundQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 540                    # six times the worker timeout (90 s)
      RedrivePolicy: {deadLetterTargetArn: !GetAtt InboundDLQ.Arn, maxReceiveCount: 3}
  AlertDLQ:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600}
  AlertQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180                    # six times the sender timeout (30 s)
      RedrivePolicy: {deadLetterTargetArn: !GetAtt AlertDLQ.Arn, maxReceiveCount: 3}

  # ---------------------------------------------------------------- auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-officers
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - {Name: agency, AttributeDataType: String, Mutable: true}
      Policies:
        PasswordPolicy: {MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireUppercase: true, RequireSymbols: false}
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: jaltaap-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      ReadAttributes: [email, custom:agency]
      PreventUserExistenceErrors: ENABLED
  OfficersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: officers, UserPoolId: !Ref UserPool, Description: "PWD, MCD and NDMC officers"}

  # ---------------------------------------------------------------- maps and geocoding
  MapKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub ${AWS::StackName}-map
      Description: Browser map tiles for the public site (public by design, restricted by referrer)
      NoExpiry: true
      Restrictions:
        AllowActions: ["geo-maps:*"]
        AllowResources: [!Sub "arn:aws:geo-maps:${AWS::Region}::provider/default"]
        AllowReferers: [!Sub "${WebOrigin}/*"]
  PlacesKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub ${AWS::StackName}-places
      Description: Server-side geocoding. Copy its value into SSM /jaltaap/location/places_api_key.
      NoExpiry: true
      Restrictions:
        AllowActions: ["geo-places:Geocode"]
        AllowResources: [!Sub "arn:aws:geo-places:${AWS::Region}::provider/default"]

  # ---------------------------------------------------------------- functions
  WhatsAppWebhookFn:
    Type: AWS::Serverless::Function
    DependsOn: WhatsAppWebhookLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-whatsapp-webhook
      Handler: handlers.webhook_whatsapp.handler
      Events:
        Verify: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /webhooks/whatsapp, Method: GET}}
        Inbound: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /webhooks/whatsapp, Method: POST}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IdempotencyTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt InboundQueue.QueueName}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
  WhatsAppWebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-whatsapp-webhook", RetentionInDays: 7}

  TelegramWebhookFn:
    Type: AWS::Serverless::Function
    DependsOn: TelegramWebhookLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-telegram-webhook
      Handler: handlers.webhook_telegram.handler
      Events:
        Inbound: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /webhooks/telegram, Method: POST}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IdempotencyTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt InboundQueue.QueueName}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
  TelegramWebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-telegram-webhook", RetentionInDays: 7}

  AgentWorkerFn:
    Type: AWS::Serverless::Function
    DependsOn: AgentWorkerLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      Handler: handlers.worker.handler
      Timeout: 90
      MemorySize: 1024
      Events:
        Inbound: {Type: SQS, Properties: {Queue: !GetAtt InboundQueue.Arn, BatchSize: 1}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SubscriptionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ConversationsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ReportsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IdempotencyTable}
        - DynamoDBReadPolicy: {TableName: !Ref RiskCacheTable}
        - S3CrudPolicy: {BucketName: !Sub "jaltaap-${AWS::AccountId}-${AWS::Region}"}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"            # narrow to the chosen model and inference-profile ARNs
  AgentWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-worker", RetentionInDays: 7}

  ChatApiFn:
    Type: AWS::Serverless::Function
    DependsOn: ChatApiLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-chat-api
      Handler: handlers.chat_api.handler
      Timeout: 28
      MemorySize: 1024
      Events:
        Chat: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /chat, Method: POST}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ConversationsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IdempotencyTable}
        - DynamoDBReadPolicy: {TableName: !Ref RiskCacheTable}
        - DynamoDBReadPolicy: {TableName: !Ref SubscriptionsTable}
        - S3ReadPolicy: {BucketName: !Sub "jaltaap-${AWS::AccountId}-${AWS::Region}"}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
  ChatApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-chat-api", RetentionInDays: 7}

  RiskRefreshFn:
    Type: AWS::Serverless::Function
    DependsOn: RiskRefreshLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-risk-refresh
      Handler: handlers.risk_refresh.handler
      Timeout: 60
      MemorySize: 512
      Events:
        Hourly: {Type: ScheduleV2, Properties: {ScheduleExpression: rate(1 hour)}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref RiskCacheTable}
        - DynamoDBReadPolicy: {TableName: !Ref SubscriptionsTable}
        - DynamoDBReadPolicy: {TableName: !Ref ReportsTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt AlertQueue.QueueName}
        - S3ReadPolicy: {BucketName: !Sub "jaltaap-${AWS::AccountId}-${AWS::Region}"}
  RiskRefreshLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-risk-refresh", RetentionInDays: 7}

  DailyBriefFn:
    Type: AWS::Serverless::Function
    DependsOn: DailyBriefLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-daily-brief
      Handler: handlers.daily_brief.handler
      Timeout: 60
      MemorySize: 512
      Events:
        Brief:
          Type: ScheduleV2
          Properties: {ScheduleExpression: "cron(30 5 * * ? *)", ScheduleExpressionTimezone: Asia/Kolkata}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref SubscriptionsTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt AlertQueue.QueueName}
  DailyBriefLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-daily-brief", RetentionInDays: 7}

  AlertSenderFn:
    Type: AWS::Serverless::Function
    DependsOn: AlertSenderLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-alert-sender
      Handler: handlers.alert_sender.handler
      Timeout: 30
      Events:
        Alerts: {Type: SQS, Properties: {Queue: !GetAtt AlertQueue.Arn, BatchSize: 10}}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref UsersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SubscriptionsTable}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
        - Statement:
            - {Effect: Allow, Action: [ses:SendEmail], Resource: "*"}
  AlertSenderLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-alert-sender", RetentionInDays: 7}

  VerifierFn:
    Type: AWS::Serverless::Function
    DependsOn: VerifierLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-verifier
      Handler: handlers.verifier.handler
      Timeout: 60
      MemorySize: 1024
      Events:
        RawPhoto:
          Type: S3
          Properties:
            Bucket: !Ref ReportsBucket
            Events: s3:ObjectCreated:*
            Filter: {S3Key: {Rules: [{Name: prefix, Value: reports/raw/}]}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ReportsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref RiskCacheTable}
        - DynamoDBReadPolicy: {TableName: !Ref UsersTable}
        - DynamoDBReadPolicy: {TableName: !Ref SubscriptionsTable}
        - SQSSendMessagePolicy: {QueueName: !GetAtt AlertQueue.QueueName}
        - S3CrudPolicy: {BucketName: !Sub "jaltaap-${AWS::AccountId}-${AWS::Region}"}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
            - {Effect: Allow, Action: [ses:SendEmail], Resource: "*"}
  VerifierLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-verifier", RetentionInDays: 7}

  PublicApiFn:
    Type: AWS::Serverless::Function
    DependsOn: PublicApiLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-public-api
      Handler: handlers.public_api.handler
      MemorySize: 512
      Timeout: 25                 # live fallback when RiskCache is empty right after the first deploy
      Events:
        Health: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /health, Method: GET}}
        Heat: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /risk/heat, Method: GET}}
        Flood: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /risk/flood, Method: GET}}
        Relief: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /relief, Method: GET}}
        Reports: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /reports, Method: GET}}
        ReplayIndex: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /replay, Method: GET}}
        Replay: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/replay/{scenario}", Method: GET}}
        UploadUrl: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /reports/upload-url, Method: POST}}
        ReportStatus: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/reports/{id}/status", Method: GET}}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref RiskCacheTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ReportsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IdempotencyTable}
        - S3CrudPolicy: {BucketName: !Sub "jaltaap-${AWS::AccountId}-${AWS::Region}"}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
  PublicApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-public-api", RetentionInDays: 7}

  OfficerApiFn:
    Type: AWS::Serverless::Function
    DependsOn: OfficerApiLogs
    Properties:
      FunctionName: !Sub ${AWS::StackName}-officer-api
      Handler: handlers.officer_api.handler
      Timeout: 28
      MemorySize: 1024
      Events:
        Queue: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /officer/reports, Method: GET, Auth: {Authorizer: CognitoAuth}}}
        Patch: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/reports/{id}", Method: PATCH, Auth: {Authorizer: CognitoAuth}}}
        Brief: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/briefs/{agency}", Method: GET, Auth: {Authorizer: CognitoAuth}}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ReportsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - DynamoDBReadPolicy: {TableName: !Ref RiskCacheTable}
        - S3ReadPolicy: {BucketName: !Sub "jaltaap-${AWS::AccountId}-${AWS::Region}"}
        - SSMParameterReadPolicy: {ParameterName: jaltaap/*}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
  OfficerApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-officer-api", RetentionInDays: 7}

  # ---------------------------------------------------------------- observability and cost
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties: {TopicName: !Sub "${AWS::StackName}-alarms"}
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties: {TopicArn: !Ref AlarmTopic, Protocol: email, Endpoint: !Ref AlarmEmail}

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-worker-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref AgentWorkerFn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  InboundDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-inbound-dlq"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt InboundDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  AlertDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-alert-dlq"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt AlertDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx-rate"
      AlarmDescription: API 5xx above 1% of requests over 5 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Metrics:
        - Id: rate
          Expression: "IF(requests > 0, 100 * errors / requests, 0)"
          ReturnData: true
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/ApiGateway, MetricName: 5xx, Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]}
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/ApiGateway, MetricName: Count, Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]}
            Period: 300
            Stat: Sum

  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: JalTaap-Ops
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {"title": "Invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${AgentWorkerFn}"], ["...", "${ChatApiFn}"], ["...", "${WhatsAppWebhookFn}"], ["...", "${TelegramWebhookFn}"], ["...", "${VerifierFn}"], ["...", "${RiskRefreshFn}"], ["...", "${PublicApiFn}"]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {"title": "Errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${AgentWorkerFn}"], ["...", "${ChatApiFn}"], ["...", "${VerifierFn}"], ["...", "${RiskRefreshFn}"], ["...", "${PublicApiFn}"], ["...", "${OfficerApiFn}"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {"title": "p95 agent latency (ms)", "region": "${AWS::Region}", "stat": "p95", "period": 300, "view": "timeSeries",
            "metrics": [["JalTaap", "AgentLatencyMs", "service", "jaltaap"]]}},
          {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {"title": "DLQ depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${InboundDLQ.QueueName}"], ["...", "${AlertDLQ.QueueName}"]]}},
          {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {"title": "Messages, alerts and reports", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
            "metrics": [["JalTaap", "MessagesIn", "service", "jaltaap"], [".", "RepliesOut", ".", "."], [".", "AlertsSent", ".", "."], [".", "ReportsVerified", ".", "."], [".", "ReportsNeedsReview", ".", "."], [".", "FallbackModelUsed", ".", "."]]}}
        ]}

  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlarmEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 25, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 40}    # USD 10
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlarmEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100}   # USD 25
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlarmEmail}]

Outputs:
  ApiUrl:
    Description: Base URL for VITE_API_URL and scripts/smoke.sh
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  WhatsAppCallbackUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhooks/whatsapp"
  TelegramWebhookUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhooks/telegram"
  BucketName:
    Value: !Ref ReportsBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MapKeyName:
    Description: Read the key value with `aws location describe-key --key-name <name> --region ap-south-1` and set VITE_MAP_KEY
    Value: !Sub ${AWS::StackName}-map
  PlacesKeyName:
    Description: Copy this key's value into SSM /jaltaap/location/places_api_key
    Value: !Sub ${AWS::StackName}-places
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=JalTaap-Ops"
